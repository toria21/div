<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>utilizando div</title>
</head>
<body>
    <h1>UTILIZANDO DIV</h1>
    <div style="background-color:#da01ee; width:600px;">
        <h3>
            Nome: <strong>Rayane</strong><br>
            Cidade/Bairro: <em>Recife</em><br>
            Profissão:<em>Italico</em>3></em><br>
        </div>
        <hr>

        <div style="background-color:#4f07eb;">
            <p>Lista não ordenada</p>
            <ul>
                <li>Maçã</li>
                <li>Banana</li>
                <li>Uva</li>
            </ul>
        </div>
        <hr>

        <div style="background-color:#90089d;">
            <p>Lista ordenada</p>
            <ol>
                <li>Primeiro</li>
                <li>Segundo</li>
                <li>Terceiro</li>
            </ol>
        </div>

        

</body>
</html>
